<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'SoulSpace - ' + ${post.title}">SoulSpace - Post</title>
    <style>
        /* --- GLOBAL & LAYOUT --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #1a1a1a; min-height: 100vh; }
        
        .main-content { margin-left: 16rem; min-height: 100vh; padding: 2rem; transition: margin-left 0.3s ease; }
        @media (max-width: 1024px) { .main-content { margin-left: 0; padding: 1.5rem; } }

        .container { max-width: 48rem; margin: 0 auto; }

        /* --- BACK LINK --- */
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: #6b7280; font-weight: 500; margin-bottom: 2rem; transition: color 0.2s; }
        .back-link:hover { color: #111827; }

        /* --- POST CARD --- */
        .post-card { background: white; border-radius: 1rem; border: 1px solid #e5e7eb; padding: 2rem; margin-bottom: 2rem; }
        .post-header { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1.5rem; }
        .author-avatar { width: 3rem; height: 3rem; background: #eff6ff; color: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.125rem; flex-shrink: 0; }
        
        .post-meta h1 { font-size: 1.5rem; font-weight: 700; color: #111827; line-height: 1.3; margin-bottom: 0.25rem; }
        .post-info { font-size: 0.875rem; color: #6b7280; }
        
        .post-body { font-size: 1.05rem; line-height: 1.7; color: #374151; margin-bottom: 1.5rem; white-space: pre-wrap; }
        
        .tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .tag { background: #f3f4f6; color: #4b5563; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.875rem; font-weight: 500; }

        /* --- COMMENTS SECTION --- */
        .comments-section { border-top: 1px solid #e5e7eb; padding-top: 2rem; }
        .comments-header { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; }

        /* Style for the Input Form */
        .comment-form { margin-bottom: 2rem; display: flex; gap: 1rem; }
        .comment-input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; resize: vertical; min-height: 60px; font-family: inherit; }
        .btn-post-comment { background: #3b82f6; color: white; border: none; padding: 0 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; height: fit-content; align-self: flex-start; padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .btn-post-comment:hover { background: #2563eb; }
        
        /* Corrected Class Names to match HTML */
        .comment-item { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        /* Renamed from .comment-avatar to .avatar to match HTML */
        .avatar { width: 2.5rem; height: 2.5rem; background: #ecfdf5; color: #059669; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.875rem; flex-shrink: 0; }
        
        /* Renamed from .comment-box to .comment-body to match HTML */
        .comment-body { background: #f9fafb; padding: 1rem 1.25rem; border-radius: 0.75rem; flex: 1; }
        
        .comment-author { font-weight: 600; font-size: 0.9rem; color: #111827; margin-bottom: 0.25rem; display: block; }
        .comment-date { font-weight: 400; color: #9ca3af; font-size: 0.8rem; margin-left: 0.5rem; }
    </style>
</head>
<body>
    <div th:replace="~{navigation :: sidebar-fragment}"></div>

    <main class="main-content">
        <div class="container">
            <a th:href="@{/forum}" class="back-link">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Forum
            </a>

            <div class="post-card">
                <div class="post-header">
                    <div class="author-avatar" th:text="${post.author.initials}">JD</div>
                    <div class="post-meta">
                        <h1 th:text="${post.title}">Post Title</h1>
                        <div class="post-info">
                            Posted by <span th:text="${post.author.firstName}">Author</span>
                            • <span th:text="${post.timeAgo}">2h ago</span>
                        </div>
                    </div>

                    <div style="margin-left: auto; display: flex; gap: 0.5rem;"
                        th:if="${session.email != null and (session.email == post.author.email or session.role == 'FACULTY')}">
                        
                        <span th:if="${session.role == 'FACULTY' and session.email != post.author.email}"
                            style="background: #fee2e2; color: #991b1b; padding: 0.5rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 700; align-self: center;">
                            ADMIN MODE
                        </span>

                        <button onclick="openEditModal()" 
                                style="background: white; border: 1px solid #d1d5db; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;">
                            Edit
                        </button>
                        
                        <form th:action="@{/forum}" method="post" onsubmit="return confirm('ADMIN ACTION: Are you sure you want to delete this post?');">
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="id" th:value="${post.id}">
                            <button type="submit" 
                                    style="background: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;">
                                Delete
                            </button>
                        </form>
                    </div>
                </div>

                <div class="post-body" th:text="${post.content}">
                    Post content goes here...
                </div>

                <div class="tags">
                    <th:block th:if="${post.tags != null}">
                         <span class="tag" th:each="tag : ${#strings.arraySplit(post.tags, ',')}" th:text="'#' + ${tag}">#tag</span>
                    </th:block>
                </div>
            </div>

            <div class="comments-section">
                <h3 class="comments-header" th:text="'Comments (' + ${#lists.size(post.comments)} + ')'">Comments (0)</h3>
                
                <div class="comment-form">
                    <form th:action="@{/forum/post/comment}" method="post" style="width: 100%; display: flex; gap: 1rem;">
                        <input type="hidden" name="postId" th:value="${post.id}">
                        <textarea class="comment-input" name="content" placeholder="Write a supportive comment..." required></textarea>
                        <button type="submit" class="btn-post-comment">Post</button>
                    </form>
                </div>

                <th:block th:if="${not #lists.isEmpty(post.comments)}">
                    <div class="comment-list">
                        <div class="comment-item" th:each="comment : ${post.comments}">
                            <div class="avatar" th:text="${comment.user.initials}">JD</div>
                            
                            <div class="comment-body">
                                <div class="comment-author">
                                    <span th:text="${comment.user.firstName} + ' ' + ${comment.user.lastName}">User Name</span>
                                    <span class="comment-date" th:text="${comment.timeAgo}">2h ago</span>
                                </div>
                                <p th:text="${comment.content}" style="color: #4b5563; font-size: 0.95rem; line-height: 1.5;">Comment content...</p>
                            </div>
                        </div>
                    </div>
                </th:block>

                <th:block th:if="${#lists.isEmpty(post.comments)}">
                    <p style="color: #6b7280; font-style: italic; text-align: center; padding: 2rem;">No comments yet. Be the first to share your thoughts!</p>
                </th:block>
            </div>
        </div>
    </main>
    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:100;">
        <div style="background:white; padding:2rem; border-radius:1rem; width:90%; max-width:500px;">
            <h2 style="margin-bottom:1rem;">Edit Post</h2>
            
            <form th:action="@{/forum}" method="post">
                <input type="hidden" name="action" value="update">
                <input type="hidden" name="id" th:value="${post.id}">
                
                <label style="display:block; margin-bottom:0.5rem; font-weight:600;">Title</label>
                <input style="width:100%; margin-bottom:1rem; padding:0.75rem; border:1px solid #ccc; border-radius:0.5rem;" 
                    type="text" name="title" th:value="${post.title}" required>
                
                <label style="display:block; margin-bottom:0.5rem; font-weight:600;">Category</label>
                <input style="width:100%; margin-bottom:1rem; padding:0.75rem; border:1px solid #ccc; border-radius:0.5rem;" 
                    type="text" name="category" th:value="${post.category}">
                
                <label style="display:block; margin-bottom:0.5rem; font-weight:600;">Content</label>
                <textarea style="width:100%; margin-bottom:1rem; padding:0.75rem; border:1px solid #ccc; border-radius:0.5rem; min-height:150px;" 
                        name="content" required th:text="${post.content}"></textarea>
                
                <div style="display:flex; justify-content:flex-end; gap:1rem;">
                    <button type="button" onclick="document.getElementById('editModal').style.display='none'" 
                            style="padding:0.5rem 1rem; border:1px solid #ccc; background:white; border-radius:0.5rem; cursor:pointer;">
                        Cancel
                    </button>
                    <button type="submit" 
                            style="padding:0.5rem 1rem; background:#3b82f6; color:white; border:none; border-radius:0.5rem; cursor:pointer;">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openEditModal() {
            document.getElementById('editModal').style.display = 'flex';
        }
    </script>
</body>
</html>
