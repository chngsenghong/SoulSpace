<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SoulSpace - Professional Messages</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #1a1a1a; height: 100vh; overflow: hidden; }
        .main-content { margin-left: 16rem; height: 100vh; display: flex; flex-direction: column; }
        @media (max-width: 1024px) { .main-content { margin-left: 0; } }

        .messaging-container { display: flex; flex: 1; background: white; }
        .conversations-sidebar { width: 320px; border-right: 1px solid #e5e7eb; background: #fff; display: flex; flex-direction: column; }

        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid #e5e7eb; }
        .sidebar-header h2 { font-size: 1.5rem; font-weight: 500; margin-bottom: 1rem;}

        /* TABS IN SIDEBAR */
        .sidebar-tabs { display: flex; gap: 0.5rem; background: #f3f4f6; padding: 0.25rem; border-radius: 0.5rem; }
        .tab-btn { flex: 1; border: none; background: none; padding: 0.5rem; border-radius: 0.4rem; cursor: pointer; font-size: 0.9rem; font-weight: 500; color: #6b7280; }
        .tab-btn.active { background: white; color: #2563eb; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        .chat-list-container { flex: 1; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .conversation-item { padding: 1rem; border-bottom: 1px solid #f3f4f6; cursor: pointer; display: flex; gap: 0.75rem; align-items: center; }
        .conversation-item:hover { background: #f9fafb; }
        .conversation-item.active { background: #eff6ff; border-left: 3px solid #2563eb; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: #f9fafb; }

        .chat-header { padding: 1rem 1.5rem; background: white; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .chat-actions { display: flex; gap: 0.5rem; align-items: center; }

        .action-btn { padding: 0.4rem 0.75rem; border-radius: 0.4rem; border: 1px solid #d1d5db; background: white; cursor: pointer; font-size: 0.85rem; text-decoration: none; color: inherit; display: inline-block; }
        .action-btn:hover { background: #f3f4f6; }

        .end-btn { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .end-btn:hover { background: #fecaca; }
        
        .restart-btn { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
        .restart-btn:hover { background: #bfdbfe; }

        .chat-messages { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; }
        .message { max-width: 75%; margin-bottom: 0.75rem; padding: 0.75rem 1rem; border-radius: 1rem; position: relative; }
        .received { background: white; align-self: flex-start; border: 1px solid #e5e7eb; }
        .sent { background: #2563eb; color: white; align-self: flex-end; }

        .chat-input-container { padding: 1rem; background: white; border-top: 1px solid #e5e7eb; }
        .chat-input-wrapper { display: flex; gap: 0.5rem; }
        .chat-input { flex: 1; padding: 0.5rem 1rem; border-radius: 1.5rem; border: 1px solid #d1d5db; }
        .send-btn { width: 2.5rem; height: 2.5rem; background: #2563eb; color: white; border: none; border-radius: 50%; cursor: pointer; }
        
        .archived-banner { text-align: center; color: #9ca3af; padding: 0.5rem; background: #f9fafb; font-size: 0.9rem; }
    </style>
</head>
<body>

<div th:replace="~{navigation :: sidebar-fragment}"></div>

<main class="main-content">
    <div class="messaging-container">

        <div class="conversations-sidebar">
            <div class="sidebar-header">
                <h2>Inbox</h2>
                <div class="sidebar-tabs">
                    <button class="tab-btn" 
                            th:classappend="${selectedTab == 'active' or selectedTab == null} ? 'active'"
                            onclick="switchList('active', this)">Active</button>
                    <button class="tab-btn" 
                            th:classappend="${selectedTab == 'history'} ? 'active'"
                            onclick="switchList('history', this)">History</button>
                </div>
            </div>

            <div class="chat-list-container">
                <div id="active-list" class="tab-content" 
                     th:classappend="${selectedTab == 'active' or selectedTab == null} ? 'active'">
                    
                    <div th:each="convo : ${conversations}"
                         class="conversation-item"
                         th:if="${convo.key != null}"
                         th:classappend="${convo.key.id == activeChatId} ? 'active' : ''"
                         th:onclick="|window.location='@{/messaging(chatWith=${convo.key.id})}'|">
                        
                        <div style="flex:1">
                            <strong th:text="${convo.key.firstName + ' ' + convo.key.lastName}">Name</strong>
                            <p style="font-size:.85rem;color:#6b7280;" 
                               th:if="${convo.value != null}"
                               th:text="${convo.value.content}">Last message...</p>
                        </div>
                    </div>
                    
                    <div th:if="${conversations == null or conversations.isEmpty()}" style="padding:1.5rem; text-align:center; color:#9ca3af;">
                        No active students.
                    </div>
                </div>

                <div id="history-list" class="tab-content" 
                     th:classappend="${selectedTab == 'history'} ? 'active'">
                    
                    <div th:each="convo : ${historyConversations}"
                         class="conversation-item"
                         th:if="${convo.key != null}"
                         th:classappend="${convo.key.id == activeChatId} ? 'active' : ''"
                         th:onclick="|window.location='@{/messaging(chatWith=${convo.key.id})}'|">
                        
                        <div style="flex:1">
                            <strong th:text="${convo.key.firstName + ' ' + convo.key.lastName}" style="color:#6b7280;">Name</strong>
                            <span style="font-size:0.7rem; background:#f3f4f6; padding:2px 6px; border-radius:4px;">Archived</span>
                        </div>
                    </div>

                    <div th:if="${historyConversations == null or historyConversations.isEmpty()}" style="padding:1.5rem; text-align:center; color:#9ca3af;">
                        No archived chats.
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-area">
            
            <div th:if="${activeChatId == null}" style="display:flex; align-items:center; justify-content:center; height:100%; color:#9ca3af;">
                Select a student to view conversation
            </div>

            <div th:if="${activeChatId != null}" style="display:flex; flex-direction:column; height:100%;">
                
                <div class="chat-header">
                    <div>
                        <strong th:text="${activePartner.firstName + ' ' + activePartner.lastName}">Student Name</strong>
                        <div th:if="${chatStatus == 'ARCHIVED'}" style="font-size:0.8rem; color:#6b7280;">
                            Archived (Read Only)
                        </div>
                    </div>

                    <div class="chat-actions">
                        <th:block th:if="${session.role == 'PROFESSIONAL'}">
                            <a th:href="@{/booking/professional}" class="action-btn">Notes</a>
                            <a th:href="@{/booking/professional}" class="action-btn">Book</a>
                        </th:block>
                        
                        <form th:if="${chatStatus == 'ACTIVE'}" th:action="@{/messaging/end}" method="post" 
                            onsubmit="return confirm('End this session? It will move to history.');">
                            <input type="hidden" name="partnerId" th:value="${activeChatId}">
                            <button type="submit" class="action-btn end-btn">End Chat</button>
                        </form>

                        <form th:if="${chatStatus == 'ARCHIVED'}" th:action="@{/messaging/restart}" method="post">
                            <input type="hidden" name="partnerId" th:value="${activeChatId}">
                            <button type="submit" class="action-btn restart-btn">Restart Chat</button>
                        </form>
                    </div>
                </div>

                <div class="chat-messages">
                    <div th:each="msg : ${activeMessages}"
                         th:if="${msg.sender != null}"
                         th:class="${msg.sender.id == session.userId} ? 'message sent' : 'message received'"
                         th:text="${msg.content}">
                    </div>
                </div>

                <div class="chat-input-container" th:if="${chatStatus == 'ACTIVE'}">
                    <form th:action="@{/messaging/send}" method="post" class="chat-input-wrapper">
                        <input type="hidden" name="receiverId" th:value="${activeChatId}">
                        <input type="text" name="content" class="chat-input" placeholder="Reply to student..." required autocomplete="off">
                        <button class="send-btn">➤</button>
                    </form>
                </div>

                <div class="archived-banner" th:if="${chatStatus == 'ARCHIVED'}">
                    This conversation has ended. Click "Restart Chat" to reply.
                </div>

            </div>
        </div>
    </div>
</main>

<script>
    function switchList(id, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(id + '-list').classList.add('active');
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>

</body>
</html>
