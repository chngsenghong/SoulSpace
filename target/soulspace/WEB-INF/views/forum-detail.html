<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'SoulSpace - ' + ${post.title}">SoulSpace - Post</title>
    <style>
        /* --- GLOBAL & LAYOUT --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #1a1a1a; min-height: 100vh; }
        
        .main-content { margin-left: 16rem; min-height: 100vh; padding: 2rem; transition: margin-left 0.3s ease; }
        @media (max-width: 1024px) { .main-content { margin-left: 0; padding: 1.5rem; } }

        .container { max-width: 48rem; margin: 0 auto; }

        /* --- BACK LINK --- */
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: #6b7280; font-weight: 500; margin-bottom: 2rem; transition: color 0.2s; }
        .back-link:hover { color: #111827; }

        /* --- POST CARD (BALANCED LAYOUT) --- */
        .post-card { 
            background: white; 
            border-radius: 1rem; 
            border: 1px solid #e5e7eb; 
            padding: 1.5rem; /* Balanced Padding */
            margin-bottom: 2rem; 
        }

        .post-header { 
            display: flex; 
            align-items: flex-start; 
            gap: 1rem; 
            margin-bottom: 1.25rem; /* Balanced spacing before content */
        }

        /* Avatar */
        .author-avatar { width: 3rem; height: 3rem; background: #eff6ff; color: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.125rem; flex-shrink: 0; }
        
        /* Post Content Text */
        .post-content-text { 
            font-size: 1.05rem; 
            line-height: 1.6; 
            color: #374151; 
            white-space: pre-wrap; /* Keeps newlines */
            margin-bottom: 1.25rem; /* Space between text and tags */
        }
        
        /* Tags */
        .tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
        .tag { background: #f3f4f6; color: #4b5563; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500; }

        /* Footer Action Bar */
        .post-footer {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #f3f4f6;
            display: flex;
            align-items: center;
        }

        /* --- COMMENTS SECTION --- */
        .comments-section { border-top: 1px solid #e5e7eb; padding-top: 2rem; }
        .comments-header { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; }
        .comment-form { margin-bottom: 2rem; display: flex; gap: 1rem; }
        .comment-input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; resize: vertical; min-height: 60px; font-family: inherit; }
        .btn-post-comment { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; height: fit-content; }
        .btn-post-comment:hover { background: #2563eb; }
        .comment-item { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .avatar { width: 2.5rem; height: 2.5rem; background: #ecfdf5; color: #059669; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.875rem; flex-shrink: 0; }
        .comment-body { background: #f9fafb; padding: 1rem 1.25rem; border-radius: 0.75rem; flex: 1; }
        .comment-author { font-weight: 600; font-size: 0.9rem; color: #111827; margin-bottom: 0.25rem; display: block; }
        .comment-date { font-weight: 400; color: #9ca3af; font-size: 0.8rem; margin-left: 0.5rem; }
    </style>
</head>
<body>
    <div th:replace="~{navigation :: sidebar-fragment}"></div>

    <main class="main-content">
        <div class="container">
            <a th:href="@{/forum}" class="back-link">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Forum
            </a>

            <div class="post-card">
    
            <div class="post-header">
                <div class="author-avatar" th:text="${post.author.initials}">JD</div>
                
                <div style="flex: 1;"> <h1 th:text="${post.title}" style="margin: 0 0 0.25rem 0; font-size: 1.25rem; line-height: 1.3;">Post Title</h1>
                    <div style="font-size: 0.85rem; color: #6b7280;">
                        Posted by <span th:text="${post.author.firstName}">Author</span>
                        • <span th:text="${post.timeAgo}">2h ago</span>
                        • <span th:text="${post.views} + ' views'">0 views</span>
                    </div>
                </div>

                <div style="display: flex; gap: 0.5rem; align-items: center;"
                    th:if="${session.email != null and (session.email == post.author.email or session.role == 'FACULTY')}">
                    
                    <span th:if="${session.role == 'FACULTY' and session.email != post.author.email}"
                        style="background: #fee2e2; color: #991b1b; padding: 0.2rem 0.5rem; border-radius: 0.3rem; font-size: 0.65rem; font-weight: 700;">
                        ADMIN
                    </span>

                    <button onclick="openEditModal()" 
                            style="background: white; border: 1px solid #d1d5db; padding: 0.3rem 0.6rem; border-radius: 0.3rem; cursor: pointer; font-size: 0.8rem;">
                        Edit
                    </button>
                    
                    <form th:action="@{/forum}" method="post" onsubmit="return confirm('ADMIN ACTION: Are you sure you want to delete this post?');" style="margin:0;">
                        <input type="hidden" name="action" value="delete">
                        <input type="hidden" name="id" th:value="${post.id}">
                        <button type="submit" 
                                style="background: #ef4444; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 0.3rem; cursor: pointer; font-size: 0.8rem;">
                            Delete
                        </button>
                    </form>
                </div>
            </div>

            <div class="post-content-text" th:text="${post.content}">
                Post content goes here...
            </div>

            <div class="tags" th:if="${post.tags != null}">
                <span class="tag" th:each="tag : ${#strings.arraySplit(post.tags, ',')}" th:text="'#' + ${tag}">#tag</span>
            </div>

            <div class="post-footer">
                <form th:action="@{/forum/post/support}" method="post" style="margin:0;">
                    <input type="hidden" name="postId" th:value="${post.id}">
                    
                    <button type="submit" 
                            th:style="${hasSupported} 
                                ? 'background: #fdf2f8; color: #db2777; border: 1px solid #fbcfe8; padding: 0.5rem 1rem; border-radius: 99px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s;' 
                                : 'background: white; color: #4b5563; border: 1px solid #d1d5db; padding: 0.5rem 1rem; border-radius: 99px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s;'">
                        
                        <svg th:if="${hasSupported}" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <svg th:unless="${hasSupported}" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        
                        <span style="font-weight: 600; font-size: 0.9rem;">
                            <span th:text="${hasSupported} ? 'Hug Sent' : 'Send Hug'">Send Hug</span>
                        </span>

                        <span th:if="${post.reactions.size() > 0}" 
                            th:text="${post.reactions.size()}"
                            style="background: #f3f4f6; padding: 0.1rem 0.5rem; border-radius: 1rem; font-size: 0.8rem; margin-left: 0.25rem; font-weight: 700; color: #374151;">
                            0
                        </span>
                    </button>
                </form>
            </div>
        </div>

            <div class="comments-section">
                <h3 class="comments-header" th:text="'Comments (' + ${#lists.size(post.comments)} + ')'">Comments (0)</h3>
                
                <div class="comment-form">
                    <form th:action="@{/forum/post/comment}" method="post" style="width: 100%; display: flex; gap: 1rem;">
                        <input type="hidden" name="postId" th:value="${post.id}">
                        <textarea class="comment-input" name="content" placeholder="Write a supportive comment..." required></textarea>
                        <button type="submit" class="btn-post-comment">Post</button>
                    </form>
                </div>

                <th:block th:if="${not #lists.isEmpty(post.comments)}">
                    <div class="comment-list">
                        <div class="comment-item" th:each="comment : ${post.comments}">
                            <div class="avatar" th:text="${comment.user.initials}">JD</div>
                            
                            <div class="comment-body">
                                <div class="comment-author">
                                    <span th:text="${comment.user.firstName} + ' ' + ${comment.user.lastName}">User Name</span>
                                    <span class="comment-date" th:text="${comment.timeAgo}">2h ago</span>
                                </div>
                                <p th:text="${comment.content}" style="color: #4b5563; font-size: 0.95rem; line-height: 1.5;">Comment content...</p>
                            </div>
                        </div>
                    </div>
                </th:block>

                <th:block th:if="${#lists.isEmpty(post.comments)}">
                    <p style="color: #6b7280; font-style: italic; text-align: center; padding: 2rem;">No comments yet. Be the first to share your thoughts!</p>
                </th:block>
            </div>
        </div>
    </main>

    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:100;">
        <div style="background:white; padding:2rem; border-radius:1rem; width:90%; max-width:500px;">
            <h2 style="margin-bottom:1rem;">Edit Post</h2>
            <form th:action="@{/forum}" method="post">
                <input type="hidden" name="action" value="update">
                <input type="hidden" name="id" th:value="${post.id}">
                <label style="display:block; margin-bottom:0.5rem; font-weight:600;">Title</label>
                <input style="width:100%; margin-bottom:1rem; padding:0.75rem; border:1px solid #ccc; border-radius:0.5rem;" type="text" name="title" th:value="${post.title}" required>
                <label style="display:block; margin-bottom:0.5rem; font-weight:600;">Category</label>
                <input style="width:100%; margin-bottom:1rem; padding:0.75rem; border:1px solid #ccc; border-radius:0.5rem;" type="text" name="category" th:value="${post.category}">
                <label style="display:block; margin-bottom:0.5rem; font-weight:600;">Content</label>
                <textarea style="width:100%; margin-bottom:1rem; padding:0.75rem; border:1px solid #ccc; border-radius:0.5rem; min-height:150px;" name="content" required th:text="${post.content}"></textarea>
                <div style="display:flex; justify-content:flex-end; gap:1rem;">
                    <button type="button" onclick="document.getElementById('editModal').style.display='none'" style="padding:0.5rem 1rem; border:1px solid #ccc; background:white; border-radius:0.5rem; cursor:pointer;">Cancel</button>
                    <button type="submit" style="padding:0.5rem 1rem; background:#3b82f6; color:white; border:none; border-radius:0.5rem; cursor:pointer;">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
    <script>function openEditModal() { document.getElementById('editModal').style.display = 'flex'; }</script>
</body>
</html>
