<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analytics - SoulSpace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f9fafb; color: #111827; }
        .main-content { margin-left: 16rem; padding: 2rem 3rem; }
        @media (max-width: 1024px) { .main-content { margin-left: 0; padding: 1.5rem; } }

        .top-controls { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .btn-tab { padding: 0.6rem 1.2rem; border-radius: 0.5rem; font-size: 0.9rem; text-decoration: none; border: 1px solid #e5e7eb; background: white; color: #374151; }
        .btn-tab.active { background: #0f172a; color: white; border-color: #0f172a; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 1rem; border: 1px solid #e5e7eb; }
        .stat-val { font-size: 2rem; font-weight: 700; color: #111827; }
        .stat-label { color: #6b7280; font-size: 0.9rem; }
        .stat-icon { font-size: 1.5rem; color: #3b82f6; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div th:replace="~{navigation :: sidebar-fragment}"></div>

    <main class="main-content">
        <div class="header-section" style="margin-bottom: 2rem;">
            <h1>Your Progress</h1>
        </div>

        <div class="top-controls">
            <a th:href="@{/learning}" class="btn-tab"><i class="fas fa-search"></i> Browse All Courses</a>
            <a th:href="@{/learning/my-courses}" class="btn-tab"><i class="fas fa-book-open"></i> My Learning</a>
            <a href="#" class="btn-tab active"><i class="fas fa-chart-bar"></i> Progress & Analytics</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="far fa-clock"></i></div>
                <div class="stat-val" th:text="${stats.hoursSpent}">0.0</div>
                <div class="stat-label">Hours Spent Learning</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-val" th:text="${stats.coursesCompleted}">0</div>
                <div class="stat-label">Courses Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-fire"></i></div>
                <div class="stat-val" th:text="${stats.dayStreak}">1</div>
                <div class="stat-label">Day Streak</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-certificate"></i></div>
                <div class="stat-val" th:text="${stats.certificatesEarned}">0</div>
                <div class="stat-label">Certificates Earned</div>
            </div>
        </div>
    </main>
</body>
</html>
