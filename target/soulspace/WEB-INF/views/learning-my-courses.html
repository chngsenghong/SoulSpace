<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Learning - SoulSpace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f9fafb; color: #111827; }
        .main-content { margin-left: 16rem; padding: 2rem 3rem; }
        @media (max-width: 1024px) { .main-content { margin-left: 0; padding: 1.5rem; } }
        
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
        .course-card { background: white; border: 1px solid #e5e7eb; border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; }
        .card-banner { height: 120px; background: linear-gradient(135deg, #3b82f6 0%, #a855f7 100%); padding: 1.5rem; position: relative; }
        .card-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.125rem; font-weight: 700; margin-bottom: 0.5rem; }
        .btn-continue { margin-top: auto; background: #7c3aed; color: white; text-align: center; padding: 0.875rem; border-radius: 0.5rem; text-decoration: none; font-weight: 500; }
        .btn-continue:hover { background: #6d28d9; }
        
        .top-controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .btn-tab { padding: 0.6rem 1.2rem; border-radius: 0.5rem; font-size: 0.9rem; text-decoration: none; border: 1px solid #e5e7eb; background: white; color: #374151; }
        .btn-tab.active { background: #0f172a; color: white; border-color: #0f172a; }
        
        .empty-state { text-align: center; padding: 4rem; color: #6b7280; }
    </style>
</head>
<body>
    <div th:replace="~{navigation :: sidebar-fragment}"></div>

    <main class="main-content">
        <div class="header-section" style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.75rem;">My Learning</h1>
            <p style="color: #6b7280;">Track your progress and continue where you left off</p>
        </div>

        <div class="top-controls">
            <a th:href="@{/learning}" class="btn-tab"><i class="fas fa-search"></i> Browse All Courses</a>
            <a href="#" class="btn-tab active"><i class="fas fa-book-open"></i> My Learning</a>
            <a th:href="@{/learning/analytics}" class="btn-tab"><i class="fas fa-chart-bar"></i> Progress & Analytics</a>
        </div>

        <div th:if="${enrollments == null || enrollments.isEmpty()}" class="empty-state">
            <i class="fas fa-book" style="font-size: 3rem; margin-bottom: 1rem; color: #d1d5db;"></i>
            <h3>No courses enrolled yet</h3>
            <p>Go to the <a th:href="@{/learning}" style="color: #3b82f6;">Browse</a> tab to start learning!</p>
        </div>

        <div class="courses-grid">
            <div class="course-card" th:each="enrollment : ${enrollments}">
                <div class="card-banner"></div>
                <div class="card-body">
                    <h3 class="card-title" th:text="${enrollment.course.title}">Title</h3>
                    <p style="font-size: 0.9rem; color: #6b7280; margin-bottom: 1rem;">
                        <i class="fas fa-chalkboard-teacher"></i> <span th:text="${enrollment.course.author}"></span>
                    </p>
                    
                    <div style="margin-bottom: 1rem;">
                        <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:0.3rem;">
                            <span>Progress</span>
                            <span th:text="${enrollment.progressPercent} + '%'">0%</span>
                        </div>
                        
                        <div style="height:6px; background:#f3f4f6; border-radius:3px; overflow:hidden;">
                            <div th:style="'width:' + ${enrollment.progressPercent} + '%; height:100%; background:#7c3aed; border-radius:3px;'"></div>
                        </div>
                    </div>

                    <a th:href="@{/learning/{id}(id=${enrollment.course.id})}" class="btn-continue">Continue Learning</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
